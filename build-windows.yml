name: Build TheoPlanner for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name TheoPlanner theoplanner.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TheoPlanner-Windows-EXE
          path: dist/TheoPlanner.exe
          if-no-files-found: error
